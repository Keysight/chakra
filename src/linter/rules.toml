#:schema ./rules.schema.json
# Chakra linter rules: one [[rule]] entry per check.
# Syntax: rules.schema.json (keys, types, ID and name patterns).
# Cross-rule checks: tests/linter/test_rules_toml.py.
# Suitability entries (SUI) come first; each rule's consumer_impact line sets its impacts.

# Suitability: one entry per consumer. The impact that each rule sets for a
# consumer is the rule's own consumer_impact line, applied when a finding of the rule
# reports at fatal, error or warning. Every rule declares all three consumers;
# READY means no effect. The line is flat: one impact value per
# consumer, with no case split; a case that differs is a separate rule.

[[consumer]]
id = "SUI001"
name = "replay"
description = "Suitability (replay) for Replay: re-executing the recorded operators on hardware. The verdict is the worst replay value in the consumer_impact line of the rules that fired; the report lists which rules caused it."

[[consumer]]
id = "SUI002"
name = "simulator"
description = "Suitability (simulator) for Simulator: modeling execution time from the graph. The verdict is the worst simulator value in the consumer_impact line of the rules that fired; the report lists which rules caused it."

[[consumer]]
id = "SUI003"
name = "analysis"
description = "Suitability (analysis) for Analysis: studying the timing and structure of a captured run. The verdict is the worst analysis value in the consumer_impact line of the rules that fired; the report lists which rules caused it."

# Integrity

[[rule]]
id = "INT001"
name = "decode-failure"
description = "The Chakra protobuf decoder cannot read the file. Causes include a corrupt, truncated or non-Chakra file. Every use is unsuitable because no node can be read."
enabled = true
severity = "fatal"
message = "decode failure: {error}"
consumer_impact = { replay = "NOT SUITABLE", simulator = "NOT SUITABLE", analysis = "NOT SUITABLE" }

[[rule]]
id = "INT002"
name = "empty-trace"
description = "The trace holds a metadata header but no nodes. Consumers have nothing to replay, simulate or analyze."
enabled = true
severity = "fatal"
message = "trace holds a metadata header node but no other nodes"
consumer_impact = { replay = "NOT SUITABLE", simulator = "NOT SUITABLE", analysis = "NOT SUITABLE" }

[[rule]]
id = "INT003"
name = "schema-unknown-type"
description = "A node carries a type that the installed mlc-chakra schema does not define. The trace likely comes from a newer or foreign schema. Consumers may misread the node, so no consumer is suitable."
enabled = true
severity = "error"
message = "node type {type} not in Chakra schema version {version}"
consumer_impact = { replay = "NOT SUITABLE", simulator = "NOT SUITABLE", analysis = "NOT SUITABLE" }

[[rule]]
id = "INT004"
name = "node-count"
description = "The trace decoded and holds nodes. The row reports the node total and the installed schema version. It informs only and lowers no consumer."
enabled = true
severity = "info"
message = "read and decoded {count} nodes using schema version {version}"
consumer_impact = { replay = "READY", simulator = "READY", analysis = "READY" }

# Metadata

[[rule]]
id = "MET001"
name = "meta-missing-version"
description = "The global metadata of the trace carries no schema version. Readers cannot tell which Chakra schema wrote the trace, so no consumer can trust how to decode it. This is the only required metadata attribute."
enabled = true
severity = "warning"
message = "global metadata lacks a version number"
consumer_impact = { replay = "REVIEW", simulator = "REVIEW", analysis = "REVIEW" }

[[rule]]
id = "MET002"
name = "meta-missing-schema"
description = "The global metadata of a PyTorch-derived trace lacks the schema attribute, the version string of the PyTorch execution trace format (for example 1.1.1-chakra.0.0.4). The Chakra converter copies it from the host trace header. Reviewers cannot confirm which format produced the capture."
enabled = true
severity = "warning"
message = "global metadata lacks {name} attribute"
consumer_impact = { replay = "REVIEW", simulator = "REVIEW", analysis = "REVIEW" }

[[rule]]
id = "MET003"
name = "meta-missing-pid"
description = "The global metadata of a PyTorch-derived trace lacks the pid attribute, the process ID of the captured program. The Chakra converter copies it from the host trace header; the Kineto device trace carries the same pid. Analysis cannot tie the capture to its source process. Replay and simulation do not use it."
enabled = true
severity = "warning"
message = "global metadata lacks {name} attribute"
consumer_impact = { replay = "READY", simulator = "READY", analysis = "LIMITED" }

[[rule]]
id = "MET004"
name = "meta-missing-time"
description = "The global metadata of a PyTorch-derived trace lacks the time attribute, the wall-clock date and time of the capture (for example 2026-11-03 09:49:39). The Chakra converter copies it from the host trace header. Analysis cannot place the capture in time. Replay and simulation do not use it."
enabled = true
severity = "warning"
message = "global metadata lacks {name} attribute"
consumer_impact = { replay = "READY", simulator = "READY", analysis = "LIMITED" }

[[rule]]
id = "MET005"
name = "meta-missing-start-ts"
description = "The global metadata of a PyTorch-derived trace lacks the start_ts attribute, the start of the capture window in microseconds on the profiler clock. The Chakra converter copies it from the host trace header. Analysis cannot compute the capture duration. MET007 checks the order of start_ts and finish_ts."
enabled = true
severity = "warning"
message = "global metadata lacks {name} attribute"
consumer_impact = { replay = "READY", simulator = "READY", analysis = "LIMITED" }

[[rule]]
id = "MET006"
name = "meta-missing-finish-ts"
description = "The global metadata of a PyTorch-derived trace lacks the finish_ts attribute, the end of the capture window in microseconds on the profiler clock. The Chakra converter copies it from the host trace header. Analysis cannot compute the capture duration. MET007 checks the order of start_ts and finish_ts."
enabled = true
severity = "warning"
message = "global metadata lacks {name} attribute"
consumer_impact = { replay = "READY", simulator = "READY", analysis = "LIMITED" }

[[rule]]
id = "MET007"
name = "meta-time-order"
description = "The finish_ts of a PyTorch-derived trace precedes its start_ts. The capture window is inconsistent, so timing analysis cannot rely on it."
enabled = true
severity = "warning"
message = "global metadata finish_ts {finish} precedes start_ts {start}"
consumer_impact = { replay = "READY", simulator = "READY", analysis = "LIMITED" }

[[rule]]
id = "DAG001"
name = "dag-duplicate-node"
description = "Two or more nodes share one ID. Dependencies become ambiguous, so the graph cannot be trusted."
enabled = true
severity = "error"
message = "node ID reuses an earlier node ID"
consumer_impact = { replay = "NOT SUITABLE", simulator = "NOT SUITABLE", analysis = "NOT SUITABLE" }

[[rule]]
id = "DAG002"
name = "dag-dangling-dep"
description = "A node depends on an ID that no node carries. The rule checks every ID in both ctrl_deps and data_deps. Dependency 0 is excluded because it marks a root node. The report shows the number of dangling dependencies. The missing parent breaks execution order."
enabled = true
severity = "error"
message = "node references a missing node"
consumer_impact = { replay = "NOT SUITABLE", simulator = "NOT SUITABLE", analysis = "NOT SUITABLE" }

[[rule]]
id = "DAG003"
name = "dag-self-dep"
description = "A node lists its own ID as a dependency. The node can never become ready, so replay and simulation stall."
enabled = true
severity = "error"
message = "node references itself"
consumer_impact = { replay = "NOT SUITABLE", simulator = "NOT SUITABLE", analysis = "NOT SUITABLE" }

[[rule]]
id = "DAG004"
name = "dag-duplicate-dep"
description = "A node repeats the same parent within ctrl_deps or within data_deps. The same parent once in each field is valid. The cycle check (DAG005) accepts a repeat, so the defect would pass unnoticed. A repeat signals a generator defect."
enabled = true
severity = "error"
message = "repeated dependency ID within ctrl_deps or within data_deps"
consumer_impact = { replay = "NOT SUITABLE", simulator = "NOT SUITABLE", analysis = "NOT SUITABLE" }

[[rule]]
id = "DAG005"
name = "dag-cycle"
description = "Nodes form a dependency loop within ctrl_deps or within data_deps. The count includes nodes blocked behind the loop. A cyclic graph has no valid execution order."
enabled = true
severity = "error"
message = "in or blocked by a {field} cycle"
consumer_impact = { replay = "NOT SUITABLE", simulator = "NOT SUITABLE", analysis = "NOT SUITABLE" }

# Timing

[[rule]]
id = "TIM001"
name = "timing-absent"
description = "Timing is absent. More than 50% of all nodes have zero duration, or every node of one checked type does (compute, collective, send or receive). The merge of host and device data likely did not complete. Analysis cannot use the trace, and the simulator needs review."
enabled = true
severity = "warning"
message = "zero duration; timing absent"
consumer_impact = { replay = "READY", simulator = "REVIEW", analysis = "NOT SUITABLE" }

[[rule]]
id = "TIM002"
name = "timing-partial"
description = "Timing is partial. Between 5% and 50% of all nodes have zero duration; healthy traces stay at or below 5%. Analysis fidelity drops, while replay and simulation still work."
enabled = true
severity = "warning"
message = "zero duration; timing partial"
consumer_impact = { replay = "READY", simulator = "READY", analysis = "LIMITED" }

[[rule]]
id = "TIM003"
name = "synthetic-timing-unknown"
description = "A synthetic (generated) trace has zero duration on every node. The linter cannot tell whether the generator models durations, so a reviewer decides whether analysis applies."
enabled = true
severity = "warning"
message = "zero duration on all nodes; modeled values unknown"
consumer_impact = { replay = "READY", simulator = "READY", analysis = "REVIEW" }

# Kineto link

[[rule]]
id = "KIN001"
name = "kineto-no-stream"
description = "No node has a stream attribute. The trace holds no device data, so the host trace was not linked to the Kineto device trace. A genuine CPU-only capture also triggers this rule; disable it for such traces."
enabled = true
severity = "error"
message = "no node has a stream attribute (no device data); disable KIN001 for CPU-only captures"
consumer_impact = { replay = "READY", simulator = "REVIEW", analysis = "NOT SUITABLE" }

[[rule]]
id = "KIN002"
name = "kineto-no-duration"
description = "Nodes carry stream data but none has a duration. Device activity was linked without timing, so timing analysis is impossible."
enabled = true
severity = "error"
message = "stream data present but no node has a duration"
consumer_impact = { replay = "READY", simulator = "REVIEW", analysis = "NOT SUITABLE" }

[[rule]]
id = "KIN003"
name = "kineto-orphan"
description = "A device node (a GPU operation on a stream other than 0) has no host parent in the trace, so it is an orphan, while some nodes carry durations. The link between host operator and device kernel is lost. KIN005 covers a trace without durations."
enabled = true
severity = "warning"
message = "device node has no host parent"
consumer_impact = { replay = "READY", simulator = "LIMITED", analysis = "LIMITED" }

[[rule]]
id = "KIN004"
name = "kineto-multi-parent"
description = "A device node has more than one host parent, while some nodes carry durations. The link between host operator and device kernel is ambiguous. KIN006 covers a trace without durations."
enabled = true
severity = "warning"
message = "device node has multiple host parents"
consumer_impact = { replay = "READY", simulator = "LIMITED", analysis = "LIMITED" }

[[rule]]
id = "KIN005"
name = "kineto-orphan-untimed"
description = "A device node (a GPU operation on a stream other than 0) has no host parent, so it is an orphan, and no node carries a duration. The link between host operator and device kernel is lost, and the device data holds no timing. KIN003 covers a trace with durations."
enabled = true
severity = "error"
message = "device node has no host parent and no node has a duration"
consumer_impact = { replay = "READY", simulator = "REVIEW", analysis = "NOT SUITABLE" }

[[rule]]
id = "KIN006"
name = "kineto-multi-parent-untimed"
description = "A device node has more than one host parent, and no node carries a duration. The link between host operator and device kernel is ambiguous, and the device data holds no timing. KIN004 covers a trace with durations."
enabled = true
severity = "error"
message = "device node has multiple host parents and no node has a duration"
consumer_impact = { replay = "READY", simulator = "REVIEW", analysis = "NOT SUITABLE" }

# Communication

[[rule]]
id = "COM001"
name = "comm-no-device-data"
description = "The trace holds host-side communication operators (record_param_comms) but no device-side communication node, so the Kineto device data for them is absent. The communication type, size and process group are missing. Replay and simulation cannot model the communications, and analysis cannot attribute their execution time."
enabled = true
severity = "error"
message = "{count} host-side communication operators, no device-side communication node"
consumer_impact = { replay = "NOT SUITABLE", simulator = "NOT SUITABLE", analysis = "LIMITED" }

[[rule]]
id = "COM002"
name = "comm-missing-type"
description = "A collective node lacks comm_type. Replay and simulation cannot tell which collective to run, such as all-reduce or all-gather."
enabled = true
severity = "error"
message = "missing comm_type attr"
consumer_impact = { replay = "NOT SUITABLE", simulator = "NOT SUITABLE", analysis = "REVIEW" }

[[rule]]
id = "COM003"
name = "comm-missing-size"
description = "A collective, send or receive node lacks comm_size. Replay and simulation cannot size the transfer."
enabled = true
severity = "error"
message = "missing comm_size attr"
consumer_impact = { replay = "NOT SUITABLE", simulator = "NOT SUITABLE", analysis = "REVIEW" }

[[rule]]
id = "COM004"
name = "comm-missing-pg-name"
description = "A collective node lacks the pg_name attribute, which names its process group. Consumers assume that all nodes participate in a single process group, so a run with several groups may be modeled incorrectly."
enabled = true
severity = "warning"
message = "missing pg_name attr"
consumer_impact = { replay = "REVIEW", simulator = "REVIEW", analysis = "REVIEW" }

[[rule]]
id = "COM005"
name = "comm-missing-src"
description = "A send or receive node lacks comm_src. Replay and simulation cannot identify the sending peer."
enabled = true
severity = "error"
message = "missing comm_src attr"
consumer_impact = { replay = "NOT SUITABLE", simulator = "NOT SUITABLE", analysis = "REVIEW" }

[[rule]]
id = "COM006"
name = "comm-missing-dst"
description = "A send or receive node lacks comm_dst. Replay and simulation cannot identify the receiving peer."
enabled = true
severity = "error"
message = "missing comm_dst attr"
consumer_impact = { replay = "NOT SUITABLE", simulator = "NOT SUITABLE", analysis = "REVIEW" }

[[rule]]
id = "COM007"
name = "comm-zero-size"
description = "A communication node declares a comm_size of zero. Replay and simulation cannot model a transfer with no payload."
enabled = true
severity = "error"
message = "zero comm_size"
consumer_impact = { replay = "NOT SUITABLE", simulator = "NOT SUITABLE", analysis = "REVIEW" }

# Operators

[[rule]]
id = "OPS001"
name = "op-schema-missing"
description = "Some CPU operators have no op_schema (the PyTorch operator signature that replay calls), while others do. A replay unit is the outermost CPU node with an op_schema, run with its whole subtree. A node without an op_schema that has children acts as a wrapper, and replay moves to its children. A childless node without an op_schema, outside any replay unit and not matching an exempt pattern, has nothing to call. The report holds one finding per operator family, the name group derived from the node name (namespace, else leading words), so new operators appear without a rule change. OPS005 covers a trace where no operator has an op_schema."
enabled = true
severity = "warning"
message = "CPU operators named {family} have no op_schema; replay cannot call them"
consumer_impact = { replay = "REVIEW", simulator = "READY", analysis = "READY" }
# Shell-style name patterns of childless annotations and framework wrappers
# that mark regions or run through a parent operator; replay never calls them
exempt = [
    "record_param_comms",
    "nccl:*",
    "TorchDynamo*",
    "Torch-Compiled Region*",
    "Pregraph bytecode",
    "AOTDispatcher*",
    "CompiledFunction*",
    "FullyShardedDataParallel*",
    "autograd::*",
    "torch::*",
    "*Backward[0-9]",
    "*Backward",
    "triton_*",
    "## *",
    "[pytorch|*",
    "enumerate(*",
    "Optimizer.*",
    "batch_id*",
    "ProfilerStep*",
    "detach",
    "detach_",
    "_[A-Z]*",
    "*Function",
    "FusedAttnFunc",
    "MakeViewlessTensor",
    "LinearWithGradAccumulationAndAsyncCommunication",
]

[[rule]]
id = "OPS002"
name = "op-schema-kernel-note"
description = "Informational note that changes no impact. GPU compute nodes have no op_schema, listed per kernel family derived from the kernel name. Replay runs the CPU operator that launches the kernel, so a kernel needs no schema."
enabled = true
severity = "pass"
message = "GPU kernels named {family} have no op_schema; replay runs the CPU operator that launches them"
consumer_impact = { replay = "READY", simulator = "READY", analysis = "READY" }

[[rule]]
id = "OPS003"
name = "op-schema-no-cpu"
description = "A captured trace has no replayable CPU operator: no CPU node with an op_schema, and no childless node outside the exempt wrappers. Replay has nothing to run. OPS006 covers a synthetic trace."
enabled = true
severity = "error"
message = "no replayable CPU operators: {total} compute nodes, {schema} have op_schema"
consumer_impact = { replay = "NOT SUITABLE", simulator = "READY", analysis = "READY" }

[[rule]]
id = "OPS004"
name = "compute-no-cost"
description = "A compute node in a captured trace has no tensor input or output and zero duration. The simulator has no cost to model for it."
enabled = true
severity = "error"
message = "missing I/O and duration"
consumer_impact = { replay = "READY", simulator = "NOT SUITABLE", analysis = "READY" }

[[rule]]
id = "OPS005"
name = "op-schema-none"
description = "No CPU node that replay would need to call has an op_schema (the PyTorch operator signature), so replay cannot map any operator to a PyTorch call. OPS001 covers a trace where some operators have one. The report holds one finding per operator family."
enabled = true
severity = "error"
message = "CPU operators named {family} have no op_schema; no operator in the trace has one"
consumer_impact = { replay = "NOT SUITABLE", simulator = "READY", analysis = "READY" }

[[rule]]
id = "OPS006"
name = "op-schema-no-cpu-synthetic"
description = "A synthetic trace has no replayable CPU operator, as generated traces may lack them by design. Replay has nothing to run, and the origin of the trace is unknown, so a reader reviews it. OPS003 covers a captured trace."
enabled = true
severity = "warning"
message = "no replayable CPU operators in a synthetic trace: {total} compute nodes, {schema} have op_schema"
consumer_impact = { replay = "REVIEW", simulator = "READY", analysis = "READY" }

# Operator I/O

[[rule]]
id = "IO001"
name = "io-malformed"
description = "A replay unit carries input or output fields that do not parse, or whose values, shapes and types lists differ in length. Replay cannot build the operator arguments."
enabled = true
severity = "error"
message = "CPU operators with malformed I/O fields"
consumer_impact = { replay = "NOT SUITABLE", simulator = "READY", analysis = "READY" }

[[rule]]
id = "IO002"
name = "io-schema-arity"
description = "A replay unit (a CPU node that replay calls) records a number of inputs that differs from the argument count of its op_schema. Replay may pass the wrong arguments, so a reviewer compares the recorded inputs with the schema."
enabled = true
severity = "warning"
message = "CPU operators with input count differing from op_schema"
consumer_impact = { replay = "REVIEW", simulator = "READY", analysis = "READY" }

[[rule]]
id = "IO003"
name = "io-cpu-missing"
description = "A replay unit has an op_schema that expects arguments, but records no inputs and no outputs. Replay has no tensors to pass, so a reviewer confirms whether the operator needs tensors."
enabled = true
severity = "warning"
message = "CPU operators with op_schema but no I/O"
consumer_impact = { replay = "REVIEW", simulator = "READY", analysis = "READY" }

# Node attributes

[[rule]]
id = "ATT001"
name = "attr-missing-converter"
description = "A node of a PyTorch-derived trace lacks an attribute that the Chakra converter writes on every CPU node: rf_id, fw_parent, seq_id, scope, tid, fw_tid, op_schema or is_cpu_op. Only is_cpu_op is required on every node; the rest apply to CPU nodes, because older converters wrote little else on device nodes. Readers fall back to default values, which can misclassify the node. One finding per attribute name."
enabled = true
severity = "warning"
message = "missing {name} attr"
consumer_impact = { replay = "REVIEW", simulator = "READY", analysis = "REVIEW" }

[[rule]]
id = "ATT002"
name = "attr-unexpected-type"
description = "A node carries a known attribute with a value type that readers do not expect, such as stream as uint64, or the node repeats an attribute name. Readers read the expected field and see a default value instead of the stored one."
enabled = true
severity = "warning"
message = "attribute of unexpected type or repeated attribute name"
consumer_impact = { replay = "REVIEW", simulator = "REVIEW", analysis = "REVIEW" }

[[rule]]
id = "ATT003"
name = "attr-invalid-id"
description = "A node of a PyTorch-derived trace has node ID 0 (uninitialized) or rf_id 0 (invalid). Thread root nodes, named [pytorch|*, carry rf_id 0 by design and are exempt. Readers use rf_id to pair nodes, so a sentinel breaks the link silently."
enabled = true
severity = "warning"
message = "node ID 0 or rf_id 0"
consumer_impact = { replay = "REVIEW", simulator = "READY", analysis = "REVIEW" }

[[rule]]
id = "ATT004"
name = "attr-invalid-scope"
description = "A node of a PyTorch-derived trace has a scope outside the RecordScope values 0 to 9. RecordScope is the PyTorch enum that classifies a node, such as forward, backward or user annotation. The NUM_SCOPES sentinel is not a scope. Readers cannot classify the node."
enabled = true
severity = "warning"
message = "scope outside 0 to 9"
consumer_impact = { replay = "REVIEW", simulator = "READY", analysis = "REVIEW" }

[[rule]]
id = "ATT005"
name = "attr-backward-link"
description = "A node of a PyTorch-derived trace has a non-zero fw_tid (forward thread ID) but a fw_parent (forward parent node ID) of 0. A backward node names its forward thread but no forward parent, so readers cannot pair it with the forward node."
enabled = true
severity = "warning"
message = "fw_tid set but fw_parent 0"
consumer_impact = { replay = "REVIEW", simulator = "READY", analysis = "REVIEW" }
